# This workflow will install Bun dependencies, build the source code, and run tests.
# For more information see: https://bun.sh/docs/install/ci

name: CI

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "dependabot/**"
    paths-ignore:
      - LICENSE
      - README.md

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: git diff --exit-code -- bin/card bin/qr
      - run: bun test

  screenshot:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun run screenshot
      - run: git diff --exit-code -- screenshot-dark.svg screenshot-light.svg

  print:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node ./bin/cli.js
